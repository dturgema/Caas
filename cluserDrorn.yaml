apiVersion: hive.openshift.io/v1
kind: ClusterDeployment
metadata:
  name: 'cluster1'
  namespace: 'cluster1'
  labels:
    cloud: 'AWS'
    region: 'eu-west-2'
    vendor: OpenShift
spec:
  baseDomain: sandbox1900.opentlc.com
  clusterName: 'cluster1'
  controlPlaneConfig:
    servingCertificates: {}
  installAttemptsLimit: 1
  installed: false
  platform:
    aws:
      credentialsSecretRef:
        name: cluster1-aws-creds
      region: eu-west-2
  provisioning:
    installConfigSecretRef:
      name: cluster1-install-config
    sshPrivateKeySecretRef:
      name: cluster1-ssh-private-key
    imageSetRef:
       #quay.io/openshift-release-dev/ocp-release:4.19.18-multi
      name: img4.19.18-multi-appsub
  pullSecretRef:
    name: cluster1-pull-secret
---
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  labels:
    cloud: Amazon
    region: eu-west-2
    name: 'cluster1'
    vendor: OpenShift
    environment: 'prod'
  name: 'cluster1'
spec:
  hubAcceptsClient: true
---
apiVersion: hive.openshift.io/v1
kind: MachinePool
metadata:
  name: cluster1-worker
  namespace: 'cluster1'
spec:
  clusterDeploymentRef:
    name: 'cluster1'
  name: worker
  platform:
    aws:
      rootVolume:
        iops: 2000
        size: 100
        type: io1
      type: m5.xlarge
  replicas: 3
---
