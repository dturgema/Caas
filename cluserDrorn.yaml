  name: 'cluster1'
  namespace: 'cluster1'
spec:
  clusterName: 'cluster1'
  clusterNamespace: 'cluster1'
  clusterLabels:
    cloud: Amazon
    vendor: OpenShift
  applicationManager:
    enabled: true
  policyController:
    enabled: true
  searchCollector:
    enabled: true
  certPolicyController:
    enabled: true
